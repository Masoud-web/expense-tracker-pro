<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="language-switcher">
            <label for="language-select">Language:</label>
            <select id="language-select">
                <option value="en">English</option>
                <option value="de">Deutsch</option>
            </select>
        </div>

        <div class="theme-switcher">
            <button id="theme-toggle" type="button">
                ðŸŒ™ Dark Mode
            </button>
        </div>

        <header>
            <h1 id="app-title">Expense Tracker</h1>
            <p id="app-subtitle">Track your income and expenses</p>
        </header>

        <section class="balance-card">
            <h2 id="balance-title">Current Balance</h2>

            <div class="search-box">
                <input
                    type="text"
                    id="search-input"
                    placeholder="Search transactions..."
                >
            </div>

            <div id="balance">$0.00</div>
        </section>

        <section class="summary">
            <div class="summary-box income">
                <h3 id="income-title">Income</h3>
                <p id="income">$0.00</p>
            </div>

            <div class="summary-box expense">
                <h3 id="expense-title">Expenses</h3>
                <p id="expenses">$0.00</p>
            </div>
        </section>

        <section class="monthly-report">
            <h2 id="monthly-report-title">Monthly Report</h2>

            <div class="month-selector">
                <label for="report-month" id="report-month-label">
                    Select Month
                </label>

                <input
                    type="month"
                    id="report-month"
                >
            </div>

            <div class="monthly-summary">

                <div class="monthly-box">
                    <h3 id="monthly-income-title">Income</h3>
                    <p id="monthly-income">$0.00</p>
                </div>

                <div class="monthly-box">
                    <h3 id="monthly-expense-title">Expenses</h3>
                    <p id="monthly-expenses">$0.00</p>
                </div>

                <div class="monthly-box">
                    <h3 id="monthly-balance-title">Balance</h3>
                    <p id="monthly-balance">$0.00</p>
                </div>

            </div>
        </section>


        <section class="monthly-budget">
            <h2 id="monthly-budget-title">Monthly Budget</h2>

            <div class="budget-input">
                <label for="monthly-budget-input" id="monthly-budget-label">
                    Set Budget
                </label>

                <input
                    type="number"
                    id="monthly-budget-input"
                    min="0"
                    step="0.01"
                    placeholder="Enter budget"
                >
            </div>

            <div class="budget-summary">
                <div class="budget-box">
                    <h3 id="budget-spent-title">Spent</h3>
                    <p id="budget-spent">$0.00</p>
                </div>

                <div class="budget-box">
                    <h3 id="budget-remaining-title">Remaining</h3>
                    <p id="budget-remaining">$0.00</p>
                </div>
            </div>

            <div class="budget-progress-container">
                <div class="budget-progress-bar">
                    <div id="budget-progress"></div>
                </div>
                <p id="budget-percentage">0%</p>
            </div>

            <p id="budget-message"></p>
        </section>
        <section class="chart-section">
            <h2 id="chart-title">Income & Expenses</h2>

            <div class="chart-container">
                <canvas id="expense-chart"></canvas>
            </div>
        </section>

        <section class="form-section">
            <h2 id="add-title">Add Transaction</h2>

            <form id="transaction-form">

                <div class="form-group">
                    <label for="description" id="description-label">
                        Description
                    </label>

                    <input
                        type="text"
                        id="description"
                        placeholder="e.g. Salary, Food, Shopping"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="amount" id="amount-label">
                        Amount
                    </label>

                    <input
                        type="number"
                        id="amount"
                        placeholder="Enter amount"
                        step="0.01"
                        min="0"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="type" id="type-label">
                        Type
                    </label>

                    <select id="type">
                        <option value="income" id="income-option">
                            Income
                        </option>

                        <option value="expense" id="expense-option">
                            Expense
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="category" id="category-label">
                        Category
                    </label>

                    <select id="category">
                        <option value="food">Food</option>
                        <option value="transport">Transport</option>
                        <option value="bills">Bills</option>
                        <option value="shopping">Shopping</option>
                        <option value="health">Health</option>
                        <option value="entertainment">Entertainment</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date" id="date-label">
                        Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        required
                    >
                </div>

                <button type="submit" id="add-button">
                    Add Transaction
                </button>

            </form>
        </section>

        <section class="transactions-section">
            <h2 id="transactions-title">Transactions</h2>

            <div class="date-range-filter">
                <div class="form-group">
                    <label for="filter-from-date">
                        From Date
                    </label>

                    <input
                        type="date"
                        id="filter-from-date"
                    >
                </div>

                <div class="form-group">
                    <label for="filter-to-date">
                        To Date
                    </label>

                    <input
                        type="date"
                        id="filter-to-date"
                    >
                </div>
            </div>
            <div class="transaction-filters">
                <button
                    type="button"
                    class="filter-btn active"
                    data-filter="all"
                >
                    All
                </button>

                <button
                    type="button"
                    class="filter-btn"
                    data-filter="income"
                >
                    Income
                </button>

                <button
                    type="button"
                    class="filter-btn"
                    data-filter="expense"
                >
                    Expenses
                </button>
            </div>

            <div class="sort-section">
                <label for="sort-select">
                    Sort:
                </label>

                <select id="sort-select">
                    <option value="date-desc">
                        Newest First
                    </option>

                    <option value="date-asc">
                        Oldest First
                    </option>

                    <option value="amount-desc">
                        Highest Amount
                    </option>

                    <option value="amount-asc">
                        Lowest Amount
                    </option>
                </select>
            </div>
            <div class="export-section">
                <button type="button" id="export-csv">
                    Export CSV
                </button>
            </div>

            <ul id="transaction-list">
                <!-- Transactions will appear here -->
            </ul>
        </section>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="script.js"></script>


    <div id="edit-modal" class="edit-modal hidden">
        <div class="edit-modal-content">

            <h2 id="edit-modal-title">Edit Transaction</h2>

            <div class="form-group">
                <label for="edit-description">Description</label>
                <input type="text" id="edit-description">
            </div>

            <div class="form-group">
                <label for="edit-amount">Amount</label>
                <input type="number" id="edit-amount" min="0" step="0.01">
            </div>

            <div class="form-group">
                <label for="edit-category">Category</label>
                <select id="edit-category">
                    <option value="food">Food</option>
                    <option value="transport">Transport</option>
                    <option value="bills">Bills</option>
                    <option value="shopping">Shopping</option>
                    <option value="health">Health</option>
                    <option value="entertainment">Entertainment</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="edit-date">Date</label>
                <input type="date" id="edit-date">
            </div>

            <div class="edit-modal-actions">
                <button type="button" id="edit-save-button">Save</button>
                <button type="button" id="edit-cancel-button">Cancel</button>
            </div>

        </div>
    </div>

</body>
</html>
