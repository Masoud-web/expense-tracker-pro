<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="language-switcher">
            <label for="language-select">Language:</label>
            <select id="language-select">
                <option value="en">English</option>
                <option value="de">Deutsch</option>
            </select>
        </div>
<div class="theme-switcher">
    <button id="theme-toggle" type="button">
        🌙 Dark Mode
    </button>
</div>

        <header>
            <h1 id="app-title">Expense Tracker</h1>
            <p id="app-subtitle">Track your income and expenses</p>
        </header>

        <section class="balance-card">
            <h2 id="balance-title">Current Balance</h2>
            <div id="balance">$0.00</div>
        </section>

        <section class="summary">
            <div class="summary-box income">
                <h3 id="income-title">Income</h3>
                <p id="income">$0.00</p>
            </div>

            <div class="summary-box expense">
                <h3 id="expense-title">Expenses</h3>
                <p id="expenses">$0.00</p>
            </div>
        </section>
<section class="chart-section">
    <h2 id="chart-title">Income & Expenses</h2>

    <div class="chart-container">
        <canvas id="expense-chart"></canvas>
    </div>
</section>
        <section class="form-section">
            <h2 id="add-title">Add Transaction</h2>

            <form id="transaction-form">

                <div class="form-group">
                    <label for="description" id="description-label">
                        Description
                    </label>

                    <input
                        type="text"
                        id="description"
                        placeholder="e.g. Salary, Food, Shopping"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="amount" id="amount-label">
                        Amount
                    </label>

                    <input
                        type="number"
                        id="amount"
                        placeholder="Enter amount"
                        step="0.01"
                        min="0"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="type" id="type-label">
                        Type
                    </label>

                    <select id="type">
                        <option value="income" id="income-option">
                            Income
                        </option>

                        <option value="expense" id="expense-option">
                            Expense
                        </option>
                    </select>
                </div>

                <button type="submit" id="add-button">
                    Add Transaction
                </button>

            </form>
        </section>

        <section class="transactions-section">
            <h2 id="transactions-title">Transactions</h2>
<div class="transaction-filters">
    <button type="button" class="filter-btn active" data-filter="all">
        All
    </button>

    <button type="button" class="filter-btn" data-filter="income">
        Income
    </button>

    <button type="button" class="filter-btn" data-filter="expense">
        Expenses
    </button>
</div>
            <ul id="transaction-list">
                <!-- Transactions will appear here -->
            </ul>
        </section>

    </div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>

</body>
</html>
